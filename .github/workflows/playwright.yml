name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-frontend:
    name: Build frontend (Flutter web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install deps and build
        run: |
          flutter --version
          flutter pub get
          flutter build web --release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-web
          path: build/web

  test:
    name: Playwright E2E Tests
    needs: build-frontend
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1-focal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download built frontend
        uses: actions/download-artifact@v4
        with:
          name: build-web
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: cd e2e && npm install --no-audit --no-fund
      - name: Serve static site and wait for readiness
        run: |
          # Start a simple HTTP server for build/web on port 5173 in the background
          python3 -m http.server 5173 --directory build/web &
          cd e2e
          # Wait until the server is reachable
          npx wait-on http://127.0.0.1:5173
      - name: Run Playwright tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: cd e2e && npx playwright test --reporter=list,html
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30